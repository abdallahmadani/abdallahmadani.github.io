  <style>
    :root{
      --bg: #f6f7f8;
      --card: #ffffff;
      --ink: #0b1320;
      --muted: #5b6677;
      --navy: #0d1b2a;
      --teal: #2aa9a1;
      --line: #e6e8ec;
      --shadow: 0 10px 30px rgba(0,0,0,.08);
      --radius: 18px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background: var(--bg);
      color: var(--ink);
      line-height: 1.65;
    }

    /* ====== Top hero with subtle "atlas" grid ====== */
    .hero{
      position:relative;
      padding: 92px 18px 56px;
      background: radial-gradient(900px 450px at 20% 10%, rgba(42,169,161,.18), transparent 60%),
                  radial-gradient(800px 500px at 80% 20%, rgba(13,27,42,.18), transparent 55%),
                  linear-gradient(180deg, #0d1b2a 0%, #0f2238 55%, #102a42 100%);
      color: #fff;
      overflow:hidden;
    }
    .hero:before{
      content:"";
      position:absolute; inset:0;
      background-image:
        linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px);
      background-size: 46px 46px;
      opacity:.35;
      pointer-events:none;
      transform: translateY(8px);
    }
    .hero-inner{
      max-width: 1050px;
      margin: 0 auto;
      position:relative;
      display:grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 28px;
      align-items:center;
    }
    @media (max-width: 860px){
      .hero-inner{grid-template-columns:1fr}
    }
    .name{
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.2rem, 4.2vw, 3.3rem);
      margin: 0 0 8px;
      letter-spacing:.2px;
    }
    .tagline{
      margin: 0 0 16px;
      color: rgba(255,255,255,.88);
      font-size: 1.05rem;
    }
    .intro{
      margin: 0 0 22px;
      color: rgba(255,255,255,.88);
      max-width: 60ch;
    }
    .chips{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top: 16px;
    }

      border: 1px solid rgba(255,255,255,.22);

      font-size: .92rem;
      color: rgba(255,255,255,.92);
      backdrop-filter: blur(6px);
    }
